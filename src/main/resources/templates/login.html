<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Leave & Payroll Portal</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            max-width: 420px;
            width: 100%;
            padding: 2.5rem;
        }
        .btn-indigo {
            background-color: #4f46e5;
            color: #ffffff;
            font-weight: 500;
            border-radius: 8px;
            border: none;
            padding: 0.75rem;
            transition: all 0.15s ease;
        }
        .btn-indigo:hover {
            background-color: #4338ca;
            color: #ffffff;
        }
        .demo-badge {
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .demo-badge:hover {
            background-color: #e2e8f0 !important;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logo -->
        <div class="text-center mb-4">
            <h1 style="color: #4f46e5" class="h3 fw-bold d-flex align-items-center justify-content-center">
                <i class="bi bi-briefcase-fill text-indigo me-2" style="color: #4f46e5;"></i>
                StaffSync<span style="color: #4f46e5;">.</span>
            </h1>
            <p class="text-secondary small mt-1">Leave & Payroll Management Portal</p>
        </div>

        <!-- Error message -->
        <div th:if="${errorMessage}" class="alert alert-danger border-0 small p-2 mb-3 rounded-2 text-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="POST">
            <div class="mb-4">
                <label for="email" class="form-label small fw-semibold text-secondary">Email Address</label>
                <input type="email" class="form-control border-slate-200 p-2.5" id="email" name="email" placeholder="Enter your email" required>
            </div>
            
            <button type="submit" class="btn btn-indigo w-100 mb-3">
                Sign In
            </button>
        </form>
    </div>
</body>
</html>
