<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="html(title, activePage, content)" lang="en">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Leave & Payroll Portal'"></title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg navbar-white bg-white border-bottom py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold text-dark" th:href="@{/(employeeId=${selectedEmployee != null ? selectedEmployee.id : 1})}">
                <i class="bi bi-briefcase-fill text-indigo me-2"></i>
                <span>StaffSync<span style="color: #4f46e5">.</span></span>
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item" th:if="${sessionRole == 'EMPLOYEE'}">
                        <a class="nav-link px-3 fw-medium" 
                           th:classappend="${activePage == 'dashboard' ? 'active text-indigo' : 'text-secondary'}"
                           th:href="@{/}">
                            <i class="bi bi-speedometer2 me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item" th:if="${sessionRole == 'EMPLOYEE'}">
                        <a class="nav-link px-3 fw-medium" 
                           th:classappend="${activePage == 'leaves' ? 'active text-indigo' : 'text-secondary'}"
                           th:href="@{/leaves}">
                            <i class="bi bi-calendar-event me-1"></i> Leaves
                        </a>
                    </li>
                    <li class="nav-item" th:if="${sessionRole == 'ADMIN'}">
                        <a class="nav-link px-3 fw-medium text-danger-hover" 
                           th:classappend="${activePage == 'admin' ? 'active text-indigo' : 'text-secondary'}"
                           th:href="@{/admin}">
                            <i class="bi bi-shield-lock me-1"></i> Admin Panel
                            <span class="badge bg-danger rounded-pill ms-1 font-monospace" 
                                  th:if="${pendingLeavesCount != null && pendingLeavesCount > 0}"
                                  th:text="${pendingLeavesCount}">1</span>
                        </a>
                    </li>
                </ul>

                <!-- Logged in user info & Log out -->
                <div class="d-flex align-items-center gap-3" th:if="${sessionRole != null}">
                    <div class="text-end d-none d-sm-block">
                        <span class="fw-semibold text-dark d-block" style="font-size: 0.85rem;" th:text="${sessionName}">John Doe</span>
                        <span class="text-secondary font-monospace" style="font-size: 0.75rem;" th:text="${sessionRole == 'ADMIN' ? 'HR Administrator' : 'Employee'}">Employee</span>
                    </div>
                    <a th:href="@{/logout}" class="btn btn-sm btn-outline-danger rounded-pill px-3 py-1.5 fw-medium">
                        <i class="bi bi-box-arrow-right me-1"></i> Sign Out
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container my-5" th:replace="${content}">
        <!-- Replaced by child template contents -->
    </main>

    <!-- Footer -->
    <footer class="footer py-4 bg-white border-top mt-auto">
        <div class="container text-center text-secondary small">
            <p class="mb-0">&copy; 2026 StaffSync. </p>
        </div>
    </footer>

    <!-- Bootstrap Bundle with Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
