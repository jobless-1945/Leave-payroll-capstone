spring.application.name=leave-payroll

# MySQL Database Connection Settings
# Adjust the URL, username, and password as per your local MySQL setup.
spring.datasource.url=jdbc:mysql://localhost:3306/leave_payroll_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf Cache (disable for development)
spring.thymeleaf.cache=false
